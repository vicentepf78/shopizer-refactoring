# Profile strangler-wave2 — BFF delegates content/search/merchant to wave2 services via RestTemplate.
# Coexists with wave1.* from application-strangler.properties (reference/tax).
wave2.strangler.enabled=true
wave2.content-service.base-url=${WAVE2_CONTENT_BASE_URL:http://content-service:8083}
wave2.search-service.base-url=${WAVE2_SEARCH_BASE_URL:http://search-service:8084}
wave2.search-service.internal-token=${SEARCH_INTERNAL_TOKEN:dev-search-token}
wave2.merchant-service.base-url=${WAVE2_MERCHANT_BASE_URL:http://merchant-service:8085}
wave2.http.client.timeout-ms=${WAVE2_HTTP_TIMEOUT_MS:5000}
wave2.search.index.reindex-delay-ms=${WAVE2_SEARCH_REINDEX_DELAY_MS:0}
wave2.merchant-service.cache.ttl-seconds=${WAVE2_MERCHANT_CACHE_TTL_SECONDS:60}

# Monolith must not bootstrap OpenSearch when search is delegated to search-service (ADR-003).
spring.autoconfigure.exclude=com.shopizer.search.autoconfigure.SearchAutoConfiguration
search.noindex=true

# Wave 1 (unchanged — coexist per TechSpec Configuração Strangler)
wave1.strangler.enabled=true
wave1.reference-service.base-url=${WAVE1_REFERENCE_BASE_URL:http://reference-service:8081}
wave1.tax-service.base-url=${WAVE1_TAX_BASE_URL:http://tax-service:8082}
wave1.http.client.timeout-ms=${WAVE1_HTTP_TIMEOUT_MS:5000}
