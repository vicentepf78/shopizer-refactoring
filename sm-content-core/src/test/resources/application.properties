spring.datasource.url=jdbc:h2:mem:contentcore;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.show-sql=false

config.cms.method=default
config.cms.files.location=./target/cms-files
config.cms.http.path.location=./target/cms-http
config.cms.aws.bucket=test-bucket
config.cms.aws.region=us-east-1
config.cms.gcp.bucket=test-gcp-bucket
